<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Pitch Simulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101318;color:white;font-family:system-ui,sans-serif}
h1{text-align:center;font-size:22px;margin:15px}
.panel{padding:12px}
label{display:block;margin:12px 0 4px}
input{width:100%}
.value{text-align:right;color:#7dd3fc}
button{width:100%;padding:14px;margin-top:15px;border:0;border-radius:10px;
background:#2563eb;color:white;font-size:18px}
canvas{display:block;width:100%;height:55vh;background:#05070a;
border-radius:14px;margin-top:10px;touch-action:none}
</style>
</head>
<body>

<h1>⚾ 3D Pitch Simulator</h1>

<div class="panel">
<label>球速 <span class="value" id="v">150</span> km/h</label>
<input id="vel" type="range" min="80" max="180" value="150">

<label>回転数 <span class="value" id="r">2500</span> rpm</label>
<input id="rpm" type="range" min="0" max="3500" value="2500">

<label>回転軸 X <span class="value" id="x">0</span>°</label>
<input id="ax" type="range" min="-180" max="180" value="0">

<label>回転軸 Y <span class="value" id="y">0</span>°</label>
<input id="ay" type="range" min="-180" max="180" value="0">

<label>回転軸 Z <span class="value" id="z">90</span>°</label>
<input id="az" type="range" min="-180" max="180" value="90">

<button onclick="throwBall()">⚾ 投げる</button>

<canvas id="c"></canvas>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let ball={x:0,y:0,z:0};
let trail=[];
let running=false;

function resize(){
 c.width=c.clientWidth*devicePixelRatio;
 c.height=c.clientHeight*devicePixelRatio;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
resize();
addEventListener("resize",resize);

for(const id of ["vel","rpm","ax","ay","az"]){
 const e=document.getElementById(id);
 const out=document.getElementById(
   id==="vel"?"v":id==="rpm"?"r":id==="ax"?"x":id==="ay"?"y":"z"
 );
 e.oninput=()=>out.textContent=e.value;
}

function project(x,y,z){
 const scale=260/(z+5);
 return {
  x:c.clientWidth/2+x*scale,
  y:c.clientHeight/2-y*scale
 };
}

function draw(){
 ctx.clearRect(0,0,c.clientWidth,c.clientHeight);

 // strike zone
 ctx.strokeStyle="#555";
 ctx.strokeRect(
   c.clientWidth/2-55,
   c.clientHeight/2-90,
   110,180
 );

 // pitcher / catcher direction
 ctx.strokeStyle="#333";
 ctx.beginPath();
 ctx.moveTo(c.clientWidth/2,20);
 ctx.lineTo(c.clientWidth/2,c.clientHeight-20);
 ctx.stroke();

 // trajectory
 if(trail.length){
  ctx.strokeStyle="#38bdf8";
  ctx.lineWidth=3;
  ctx.beginPath();
  trail.forEach((p,i)=>{
   const q=project(p.x,p.y,p.z);
   i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);
  });
  ctx.stroke();
 }

 const p=project(ball.x,ball.y,ball.z);

 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.arc(p.x,p.y,Math.max(5,13-ball.z/8),0,Math.PI*2);
 ctx.fill();

 // seam / rotation indicator
 const rpm=+document.getElementById("rpm").value;
 const ang=performance.now()/1000*rpm/60*Math.PI*2;
 ctx.strokeStyle="#222";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(p.x,p.y,Math.max(5,13-ball.z/8),
   ang,ang+Math.PI*1.2);
 ctx.stroke();

 if(running) requestAnimationFrame(draw);
}

function throwBall(){
 if(running)return;
 running=true;
 ball={x:0,y:0,z:0};
 trail=[];

 const vel=+document.getElementById("vel").value;
 const rpm=+document.getElementById("rpm").value;
 const ax=+document.getElementById("ax").value*Math.PI/180;
 const ay=+document.getElementById("ay").value*Math.PI/180;
 const az=+document.getElementById("az").value*Math.PI/180;

 let t=0;
 const speed=vel/150;
 const interval=setInterval(()=>{
   t+=0.025;

   // 0 → 18m
   ball.z=t*18*speed;

   // simplified Magnus effect
   const magnus=rpm/2500*0.018;

   ball.x=Math.sin(ay)*magnus*ball.z*ball.z;
   ball.y=Math.sin(ax)*magnus*ball.z*ball.z
        +Math.cos(az)*magnus*ball.z*0.35;

   trail.push({...ball});

   if(ball.z>=18){
     clearInterval(interval);
     running=false;
   }
 },25);

 draw();
}

draw();
</script>

</body>
</html>
